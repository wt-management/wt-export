<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>원텍 해외수출 관리</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

<style>
:root{--bg:#eef2f6;--card:#fff;--ink:#0f172a;--sub:#64748b;--line:#e6ebf1;--accent:#0891b2;--nav:#0f172a}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
.sidebar{position:fixed;top:0;left:0;width:210px;height:100vh;background:var(--nav);color:#cbd5e1;display:flex;flex-direction:column;z-index:200}
.brand{padding:18px 18px 14px;border-bottom:1px solid #1e293b}
.brand b{color:#fff;font-size:15px;font-weight:800;letter-spacing:-.3px}
.brand small{color:#64748b;font-size:11px;display:block;margin-top:2px}
.navlist{padding:10px 8px;flex:1;overflow-y:auto}
.navlabel{font-size:10px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.8px;padding:10px 12px 4px}
.navitem{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:8px;color:#94a3b8;font-size:13.5px;font-weight:600;cursor:pointer;margin-bottom:2px;transition:.12s}
.navitem:hover{background:#1e293b;color:#e2e8f0}
.navitem.on{background:var(--accent);color:#fff}
.navitem i{font-size:15px;width:18px}
.navitem .cnt{margin-left:auto;font-size:10.5px;font-weight:800;background:rgba(255,255,255,.14);border-radius:10px;padding:1px 8px}
.side-foot{padding:12px 16px;border-top:1px solid #1e293b;font-size:10.5px;color:#475569}
.main{margin-left:210px;padding:20px 26px 60px}
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.topbar h1{font-size:20px;font-weight:800;margin:0}
.topbar .sub{font-size:12.5px;color:var(--sub)}
.yrseg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
.yrseg button{border:none;background:#fff;color:#64748b;padding:7px 14px;font-size:12.5px;font-weight:700;cursor:pointer;border-right:1px solid var(--line)}
.yrseg button:last-child{border-right:none}
.yrseg button.on{background:var(--accent);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px 16px;border-left:4px solid var(--accent);cursor:default}
.kpi.clk{cursor:pointer}
.kpi.clk:hover{background:#f8feff}
.kpi .l{font-size:11.5px;color:var(--sub);font-weight:600}
.kpi .v{font-size:21px;font-weight:800;margin-top:3px;letter-spacing:-.5px}
.kpi .s{font-size:11px;color:#94a3b8;margin-top:1px}
.card2{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:16px 18px;margin-bottom:16px}
.card2 .h{font-size:13.5px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:7px}
.card2 .h small{font-weight:500;color:#94a3b8;font-size:11px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
table.tbl th{text-align:left;padding:8px 9px;border-bottom:2px solid var(--line);color:#475569;font-weight:700;font-size:11.5px;white-space:nowrap}
table.tbl th.num,table.tbl td.num{text-align:right;font-variant-numeric:tabular-nums}
table.tbl td{padding:7px 9px;border-bottom:1px solid #f1f5f9}
table.tbl tr.clk{cursor:pointer}
table.tbl tr.clk:hover{background:#f0fdff}
.chip{display:inline-block;font-size:10px;font-weight:700;padding:1px 7px;border-radius:20px;white-space:nowrap}
.chip.paid{background:#cffafe;color:#0e7490}.chip.free{background:#fef3c7;color:#b45309}
.st-req{background:#e0e7ff;color:#4338ca}.st-prep{background:#fef3c7;color:#b45309}.st-ready{background:#dbeafe;color:#1d4ed8}.st-shipped{background:#dcfce7;color:#15803d}.st-hold{background:#f1f5f9;color:#64748b}.st-cancel{background:#fee2e2;color:#b91c1c}
.flt{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.flt select,.flt input{border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12.5px;background:#fff;color:var(--ink)}
.btn-x{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 13px;font-size:12.5px;font-weight:600;cursor:pointer;color:#475569}
.btn-x:hover{background:#f8fafc}
.btn-pri{border:none;background:var(--accent);color:#fff;border-radius:8px;padding:8px 15px;font-size:13px;font-weight:700;cursor:pointer}
.btn-pri:hover{filter:brightness(1.08)}
.view{display:none}.view.on{display:block}
.tbl-wrap{overflow-x:auto}
.muted{color:#94a3b8;font-size:12px}
canvas{max-height:260px}
/* 칸반 */
.kb{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-items:start}
.kb-col{background:#f8fafc;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kb-h{padding:10px 13px;background:#fff;border-bottom:1px solid var(--line)}
.kb-h b{font-size:13px}
.kb-h .who{font-size:10.5px;color:#94a3b8;font-weight:600}
.kb-list{padding:9px;max-height:63vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.kb-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;transition:.12s}
.kb-card:hover{border-color:#67e8f9;box-shadow:0 3px 10px rgba(8,145,178,.12)}
.kb-card .t1{font-size:12.5px;font-weight:800;color:#0f172a;display:flex;justify-content:space-between;gap:6px}
.kb-card .t2{font-size:11.5px;color:#475569;margin-top:3px}
.kb-card .t3{font-size:10.5px;color:#94a3b8;margin-top:4px;display:flex;justify-content:space-between;gap:6px}
/* 달력 */
.wkgrid{display:grid;grid-template-columns:repeat(7,minmax(104px,1fr));gap:6px;min-width:760px}
.wkcell{border:1px solid #eef2f7;border-radius:9px;min-height:128px;background:#fff;overflow:hidden}
.wkcell.today{border-color:#99f6e4;background:#f0fdfa}
.wkhead{padding:5px 8px;font-size:11px;font-weight:800;border-bottom:1px solid #f1f3f7;color:#475569}
.wkitem{border-left:3px solid #0891b2;background:#0891b214;border-radius:5px;padding:3px 6px;margin:3px 5px;font-size:10.5px;line-height:1.4;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 모달 폼 */
.sect-h{font-size:12px;font-weight:800;color:#0e7490;background:#ecfeff;border-radius:7px;padding:6px 10px;margin:14px 0 10px;display:flex;justify-content:space-between;align-items:center}
.sect-h:first-child{margin-top:0}
.sect-h .team{font-size:10.5px;color:#64748b;font-weight:600}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fg{margin-bottom:10px}
.fg label{display:block;font-size:11.5px;color:#64748b;font-weight:700;margin-bottom:4px}
.fg input,.fg select,.fg textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px}
.fg input:disabled,.fg select:disabled{background:#f8fafc;color:#94a3b8}
.pill-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.pill{font-size:12px;font-weight:600;padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:#fff;cursor:pointer;color:#475569}
.pill.on{background:var(--accent);color:#fff;border-color:var(--accent)}
@media(max-width:1150px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.kb{grid-template-columns:repeat(2,1fr)}}
@media(max-width:720px){.sidebar{width:60px}.brand b,.brand small,.navitem span,.side-foot,.navlabel{display:none}.navitem{justify-content:center}.navitem .cnt{display:none}.main{margin-left:60px;padding:14px}.kb{grid-template-columns:1fr}}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script>
/* ═══════════ 상수 · 상태 ═══════════ */
var ST={req:{ko:'요청',team:'해외영업',col:'#4338ca',cls:'st-req'},prep:{ko:'준비중',team:'영업관리',col:'#b45309',cls:'st-prep'},ready:{ko:'출고대기',team:'물류',col:'#1d4ed8',cls:'st-ready'},shipped:{ko:'출고완료',team:'물류',col:'#15803d',cls:'st-shipped'},hold:{ko:'보류',team:'-',col:'#64748b',cls:'st-hold'},cancel:{ko:'취소',team:'-',col:'#b91c1c',cls:'st-cancel'}};
var EDITORS=['megan@wontech.com'];  // 이력(출고완료) 수정·삭제 허용 (관리자 외)
var APP={recs:[],seq:1}; var ME={email:'',admin:false};
var YEAR='all',MET='amt',ANALT='country',ledShow=200,schedRef=null,CUR='dash';
var ACC='#0891b2',PAL=['#0891b2','#6366f1','#f59e0b','#10b981','#ef4444','#8b5cf6','#ec4899','#14b8a6'];
function esc(s){return String(s==null?'':s).replace(/[<>&"]/g,function(c){return{'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c];});}
function usd(n){return '$'+Math.round(n||0).toLocaleString();}
function today(){return new Date().toISOString().slice(0,10);}
function nowIso(){return new Date().toISOString().slice(0,16).replace('T',' ');}
function canEditRec(r){return ME.admin||EDITORS.indexOf(ME.email)>=0||r.st!=='shipped';}
function canDel(){return ME.admin||EDITORS.indexOf(ME.email)>=0;}
function stBadge(s){var o=ST[s]||ST.req;return '<span class="chip '+o.cls+'">'+o.ko+'</span>';}
var charts={};
function mkChart(id,cfg){if(charts[id])charts[id].destroy();var el=document.getElementById(id);if(el)charts[id]=new Chart(el,cfg);}

/* ═══════════ 데이터 로드/저장 ═══════════ */
var _sb=supabase.createClient('https://mhfacbsittfdkknwybhc.supabase.co','sb_publishable_aPMOOWAlyJlMcP1ZM_gpPA_jlrcvCRd');
async function loadData(){
  var r=(await _sb.from('cons_cache').select('data').eq('key','wt_export').maybeSingle()).data;
  if(!r||!r.data)throw new Error('데이터 없음');
  APP.recs=r.data.recs||[]; APP.seq=r.data.seq||APP.recs.length+1;
}
async function saveData(changed){ // changed = [rec,...] (신규/수정), 저장 직전 서버본과 병합해 동시편집 충돌 최소화
  var r=(await _sb.from('cons_cache').select('data').eq('key','wt_export').maybeSingle()).data;
  var server=(r&&r.data)||{recs:[],seq:1};
  var map={}; (server.recs||[]).forEach(function(x,i){map[x.id]=i;});
  changed.forEach(function(c){
    if(c._del){ if(map[c.id]!=null){server.recs.splice(map[c.id],1); map={}; server.recs.forEach(function(x,i){map[x.id]=i;});} return; }
    if(map[c.id]!=null)server.recs[map[c.id]]=c; else server.recs.push(c);
  });
  server.seq=Math.max(server.seq||1,APP.seq);
  server.updatedAt=nowIso();
  var res=await _sb.from('cons_cache').upsert({key:'wt_export',data:server});
  if(res.error){alert('저장 실패: '+res.error.message);return false;}
  APP.recs=server.recs; APP.seq=server.seq;
  return true;
}

/* ═══════════ 인증 ═══════════ */
function _showLogin(msg){var ls=document.getElementById('login-screen');ls.style.display='flex';if(msg){var e=document.getElementById('login-error');e.textContent=msg;e.style.display='block';}var b=document.getElementById('login-btn');if(b){b.disabled=false;b.textContent='로그인';}}
async function _afterAuth(user){
  try{
    var prof=(await _sb.from('crm_profiles').select('access,role,display_name').eq('id',user.id).single()).data;
    var access=((prof&&prof.access)||'').split(',').map(function(x){return x.trim();});
    var ok=(prof&&prof.role==='admin')||access.indexOf('intl')>=0||access.indexOf('korea')>=0||access.indexOf('export')>=0;
    if(!ok){await _sb.auth.signOut();_showLogin('❌ 해외수출 시스템 접근 권한이 없습니다');return;}
    ME.email=(user.email||'').toLowerCase(); ME.admin=(prof&&prof.role==='admin'); ME.name=(prof&&prof.display_name)||ME.email;
    await loadData();

function _wk(ref){var r=ref||today(),p=r.split('-').map(Number),dt=new Date(p[0],p[1]-1,p[2]);var dow=(dt.getDay()+6)%7,mon=new Date(dt);mon.setDate(dt.getDate()-dow);var f=function(x){return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');};var sun=new Date(mon);sun.setDate(mon.getDate()+6);return {start:f(mon),end:f(sun),mon:mon};}
function _schedEff(){
  if(schedRef)return schedRef;

    return;
  }
  var key=ANALT==='country'?'country':(ANALT==='product'?'product':'company');
  var paid=rows.filter(function(r){return r.type==='paid';});
  var g={};rows.forEach(function(r){var k=r[key]||'-';if(!k)return;if(!g[k])g[k]={amt:0,qty:0,paid:0,free:0,set:{}};var o=g[k];o.amt+=(r.type==='paid'&&r.cur==='USD'?(r.amount||0):0);o.qty+=(r.qty||0);if(r.type==='paid')o.paid++;else o.free++;o.set[ANALT==='country'?(r.product||''):(r.country||'')]=1;});
  var arr=Object.keys(g).map(function(k){return {k:k,amt:g[k].amt,qty:g[k].qty,paid:g[k].paid,free:g[k].free,n:Object.keys(g[k].set).length};});
  arr.sort(function(a,b){return isQty()?(b.qty-a.qty):(b.amt-a.amt);});
  var top=arr.slice(0,10);
  host.innerHTML='<div class="card2"><div class="h">'+(ANALT==='country'?'🌏 국가별':(ANALT==='product'?'📦 품목별':'🏢 업체별'))+' TOP 10 <small>('+(isQty()?'수량':'유상 USD')+' 기준)</small></div><canvas id="chA"></canvas></div><div class="card2 tbl-wrap"><table class="tbl" id="aT"></table></div>';
  mkChart('chA',{type:'bar',data:{labels:top.map(function(x){return x.k;}),datasets:[{data:top.map(function(x){return isQty()?x.qty:x.amt;}),backgroundColor:ACC,borderRadius:4}]},options:{indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{ticks:{callback:function(v){return isQty()?Math.round(v).toLocaleString():('$'+(v/1e6).toFixed(1)+'M');}}}}}});
  document.getElementById('aT').innerHTML='<thead><tr><th>'+(ANALT==='country'?'국가':(ANALT==='product'?'품목':'업체'))+'</th><th class="num">수출액</th><th class="num">수량</th><th class="num">유상</th><th class="num">무상</th><th class="num">'+(ANALT==='country'?'품목수':'국가수')+'</th></tr></thead><tbody>'+arr.slice(0,300).map(function(x){return '<tr><td><b>'+esc(x.k)+'</b></td><td class="num">'+usd(x.amt)+'</td><td class="num">'+Math.round(x.qty).toLocaleString()+'</td><td class="num">'+x.paid+'</td><td class="num">'+x.free+'</td><td class="num">'+x.n+'</td></tr>';}).join('')+'</tbody>';
}

/* ═══════════ 레코드 모달 (등록/단계입력) ═══════════ */
var _cur=null,_modal=null;
function fld(id,label,html){return '<div class="fg"><label for="'+id+'">'+label+'</label>'+html+'</div>';}
function inp(id,val,type,ph,dis){return '<input id="'+id+'" type="'+(type||'text')+'" value="'+esc(val==null?'':val)+'"'+(ph?' placeholder="'+esc(ph)+'"':'')+(dis?' disabled':'')+' list="'+id+'-dl">';}
function openRec(id){
  _cur=id?APP.recs.filter(function(r){return r.id===id;})[0]:null;
  var isNew=!_cur;
  var r=_cur||{id:'S'+APP.seq,st:'req',type:'paid',date:'',country:'',company:'',product:'',productRaw:'',cat:'장비',qty:1,amount:0,cur:'USD',serial:'',prodDate:'',logi:'',ref:'',reason:'',memo:'',shipNote:'',hist:[]};
  var editable=isNew||canEditRec(r);
  document.getElementById('recTitle').innerHTML=(isNew?'📝 선적 요청 등록':esc(r.company||'-')+' · '+esc(r.product||r.productRaw||'-'))+' '+(isNew?'':stBadge(r.st));
  var dls=function(id,arr){return '<datalist id="'+id+'-dl">'+arr.map(function(v){return '<option value="'+esc(v)+'">';}).join('')+'</datalist>';};
  var b='';
  // 상태
  if(!isNew){
    b+='<div class="fg"><label>상태 (단계)</label><select id="m-st"'+(editable?'':' disabled')+'>'+Object.keys(ST).map(function(k){return '<option value="'+k+'"'+(r.st===k?' selected':'')+'>'+ST[k].ko+' ('+ST[k].team+')</option>';}).join('')+'</select></div>';
  }
  // ① 요청 (해외영업)
  b+='<div class="sect-h">① 선적 요청 <span class="team">해외영업 각 파트</span></div>';
  b+='<div class="frow">'+
    fld('m-type','구분','<select id="m-type"'+(editable?'':' disabled')+'><option value="paid"'+(r.type==='paid'?' selected':'')+'>유상 (판매)</option><option value="free"'+(r.type==='free'?' selected':'')+'>무상 (데모·전시·CS)</option></select>')+
    fld('m-country','국가',inp('m-country',r.country,'text','예: 일본',!editable))+'</div>';
  b+='<div class="frow">'+
    fld('m-company','업체명',inp('m-company',r.company,'text','거래처·법인·클리닉',!editable))+
    fld('m-ref','그룹웨어 참조',inp('m-ref',r.ref,'text','예: 영업전략파트-260729-1',!editable))+'</div>';
  b+='<div class="frow">'+
    fld('m-product','품목',inp('m-product',r.product||r.productRaw,'text','예: Oligio X',!editable))+
    fld('m-cat','분류','<select id="m-cat"'+(editable?'':' disabled')+'><option'+(r.cat==='장비'?' selected':'')+'>장비</option><option'+(r.cat!=='장비'?' selected':'')+'>소모품/부품</option></select>')+'</div>';
  b+='<div class="frow">'+
    fld('m-qty','수량',inp('m-qty',r.qty,'number','',!editable))+
    '<div id="m-paidwrap">'+fld('m-amount','금액 <span style="color:#94a3b8;font-weight:500">(유상 · 통화 선택)</span>','<div style="display:flex;gap:6px"><input id="m-amount" type="number" value="'+(r.amount||'')+'" style="flex:1"'+(editable?'':' disabled')+'><select id="m-cur" style="width:88px"'+(editable?'':' disabled')+'>'+['USD','JPY','CNY','EUR','KRW'].map(function(c){return '<option'+(r.cur===c?' selected':'')+'>'+c+'</option>';}).join('')+'</select></div>')+'</div>'+
    '<div id="m-freewrap">'+fld('m-reason','무상 사유',inp('m-reason',r.reason,'text','데모 / 전시회 / CS / FOC 등',!editable))+'</div></div>';
  // ② 준비 (영업관리)
  b+='<div class="sect-h">② 수출 준비 <span class="team">영업관리 (수출입 프로세스)</span></div>';
  b+='<div class="frow">'+
    fld('m-serial','Serial No.',inp('m-serial',r.serial,'text','시리얼 (범위 가능: ~)',!editable))+
    fld('m-prodDate','생산일자',inp('m-prodDate',r.prodDate,'date','',!editable))+'</div>';
  // ③ 물류
  b+='<div class="sect-h">③ 출고 (물류) <span class="team">물류팀</span></div>';
  b+='<div class="frow">'+
    fld('m-logi','물류사·포워더',inp('m-logi',r.logi,'text','예: DHL / 태화 / 에어로',!editable))+
    fld('m-date','출고일 (예정/확정)',inp('m-date',r.date,'date','',!editable))+'</div>';
  b+='<div class="frow">'+
    fld('m-shipNote','출고 비고',inp('m-shipNote',r.shipNote,'text','당착 / 분할 등',!editable))+
    fld('m-memo','메모',inp('m-memo',r.memo,'text','',!editable))+'</div>';
  // 이력
  if(!isNew&&r.hist&&r.hist.length){
    b+='<div class="sect-h">🕑 이력</div><div style="font-size:11.5px;color:#64748b;max-height:110px;overflow-y:auto">'+r.hist.slice().reverse().map(function(h){return '<div style="padding:2px 0">'+esc(h.at||'')+' · '+esc(h.by||'')+' — '+esc(h.a||'')+'</div>';}).join('')+'</div>';
  }
  if(!editable) b+='<div style="margin-top:10px;font-size:12px;color:#b45309;background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:8px 12px">출고완료된 이력은 관리자·김한결 과장만 수정할 수 있습니다.</div>';
  b+=dls('m-country',dlist('country'))+dls('m-company',dlist('company'))+dls('m-product',dlist('product'))+dls('m-logi',dlist('logi'));
  document.getElementById('recBody').innerHTML=b;
  document.getElementById('recDelBtn').style.display=(!isNew&&canDel())?'':'none';
  document.getElementById('recSaveBtn').style.display=editable?'':'none';
  function syncType(){var t=document.getElementById('m-type').value;document.getElementById('m-paidwrap').style.display=t==='paid'?'':'none';document.getElementById('m-freewrap').style.display=t==='free'?'':'none';}
  document.getElementById('m-type').addEventListener('change',syncType);syncType();
  _modal=new bootstrap.Modal(document.getElementById('recModal'));_modal.show();
}
function gv(id){var e=document.getElementById(id);return e?e.value:'';}
async function saveRec(){
  var isNew=!_cur;
  var r=_cur?JSON.parse(JSON.stringify(_cur)):{id:'S'+APP.seq,st:'req',hist:[]};
  var prevSt=r.st;
  if(!isNew&&document.getElementById('m-st'))r.st=gv('m-st');
  r.type=gv('m-type');r.country=gv('m-country').trim();r.company=gv('m-company').trim();
  r.product=gv('m-product').trim();if(!r.productRaw)r.productRaw=r.product;
  r.cat=gv('m-cat');r.qty=Number(gv('m-qty'))||0;
  r.amount=Number(gv('m-amount'))||0;r.cur=(r.type==='paid')?gv('m-cur'):'';
  r.reason=(r.type==='free')?gv('m-reason').trim():'';
  r.serial=gv('m-serial').trim();r.prodDate=gv('m-prodDate');r.logi=gv('m-logi').trim();
  r.date=gv('m-date');r.shipNote=gv('m-shipNote').trim();r.memo=gv('m-memo').trim();
  if(!r.country||!r.company||!r.product){alert('국가·업체명·품목은 필수입니다');return;}
  if(!r.qty){alert('수량을 입력하세요');return;}
  // 자동 단계 진행 제안: 시리얼 입력되면 req→prep, 물류+출고일 입력되면 →ready (수동 선택이 우선)
  if(isNew)r.st='req';
  var act=isNew?'등록':(prevSt!==r.st?('상태 '+ST[prevSt].ko+'→'+ST[r.st].ko):'수정');
  r.hist=(r.hist||[]).concat([{at:nowIso(),by:ME.name||ME.email,a:act}]).slice(-30);
  r.updAt=nowIso();r.updBy=ME.email;
  if(isNew){APP.seq++;}
  var btn=document.getElementById('recSaveBtn');btn.disabled=true;btn.textContent='저장 중...';
  var ok=await saveData([r]);
  btn.disabled=false;btn.textContent='저장';
  if(!ok)return;
  _modal.hide();renderCur();renderFlowCnt();
}
async function delRec(){
  if(!_cur)return;
  if(!confirm('이 선적 건을 삭제할까요? (되돌릴 수 없음)'))return;
  var ok=await saveData([{id:_cur.id,_del:true}]);
  if(!ok)return;
  _modal.hide();renderCur();renderFlowCnt();
}
function renderFlowCnt(){var el=document.getElementById('cntFlow');if(el)el.textContent=pendings().length;}

/* ═══════════ 라우팅 ═══════════ */
var TITLES={dash:['대시보드','수출 업무 · 실적 종합 현황'],flow:['선적 진행','요청 → 준비 → 출고 · 3팀 협업 보드'],sched:['출고 일정','주간 출고 캘린더 · 지연 관리'],ledger:['선적 대장','전체 선적 기록 · 검색/필터/CSV'],anal:['수출 분석','국가·품목·업체·무상 분석 (출고완료 기준)']};
function show(v){
  document.querySelectorAll('.navitem').forEach(function(n){n.classList.toggle('on',n.dataset.v===v);});
  document.querySelectorAll('.view').forEach(function(el){el.classList.toggle('on',el.id==='view-'+v);});
  document.getElementById('vTitle').textContent=TITLES[v][0];document.getElementById('vSub').textContent=TITLES[v][1];
  CUR=v;
  if(v==='ledger'&&!document.getElementById('fCountry').options.length)fillLedgerFilters();
  renderCur();renderFlowCnt();
}
function renderCur(){({dash:renderDash,flow:renderFlow,sched:renderSched,ledger:function(){if(!document.getElementById('fCountry').options.length)fillLedgerFilters();renderLedger();},anal:renderAnal}[CUR])();}
document.querySelectorAll('.navitem').forEach(function(n){n.onclick=function(){show(n.dataset.v);};});
document.querySelectorAll('#yrseg button').forEach(function(b){b.onclick=function(){YEAR=b.dataset.y;document.querySelectorAll('#yrseg button').forEach(function(x){x.classList.toggle('on',x===b);});renderAnal();};});
document.querySelectorAll('#metseg button').forEach(function(b){b.onclick=function(){MET=b.dataset.met;document.querySelectorAll('#metseg button').forEach(function(x){x.classList.toggle('on',x===b);});renderAnal();};});
document.querySelectorAll('#analTabs button').forEach(function(b){b.onclick=function(){ANALT=b.dataset.t;document.querySelectorAll('#analTabs button').forEach(function(x){x.classList.toggle('on',x===b);});renderAnal();};});
</script>
