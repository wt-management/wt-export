<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>원텍 해외수출 관리</title>
<link rel="preconnect" href="https://mhfacbsittfdkknwybhc.supabase.co" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--blue:#2563eb;--blue-light:#eff6ff;--sidebar-bg:#f1f5f9;--sidebar-hover:#eef2f7;--sidebar-active:#eaf1fd;--text:#111827;--text-2:#6b7280;--border:#e5e7eb;--bg:#f3f4f6;--white:#fff;--green:#16a34a;--orange:#ea580c;--navy:#16324f;--hair:#e4e8ef;--rd:#dc2626}
*{box-sizing:border-box}
body{display:flex;min-height:100vh;background:var(--bg);font-family:'Noto Sans KR',-apple-system,"Malgun Gothic",sans-serif;margin:0;color:var(--text);font-size:14px;color-scheme:only light}
/* ── 사이드바 (한국영업 스타일: 라이트) ── */
.sidebar{width:220px;background:var(--sidebar-bg);min-height:100vh;flex-shrink:0;position:fixed;top:0;left:0;bottom:0;z-index:100;overflow-y:auto;display:flex;flex-direction:column;border-right:1px solid #dbe3ec}
.sidebar-brand{padding:20px 18px 15px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--hair)}
.sidebar-brand .lg{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#0891b2,#2563eb);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;flex-shrink:0}
.sidebar-brand b{font-size:14.5px;font-weight:800;color:#1c2534;letter-spacing:-.3px;line-height:1.25;display:block}
.sidebar-brand small{font-size:10.5px;color:#64748b;display:block;margin-top:1px}
.nav-section{padding:10px 0}
.nav-label{padding:8px 20px 4px;font-size:10px;font-weight:600;letter-spacing:.08em;color:#94a3b8;text-transform:uppercase}
.sidebar .nav-link{color:#475569;padding:8px 12px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:9px;cursor:pointer;transition:all .15s;margin:1px 8px;border-radius:6px}
.sidebar .nav-link i{font-size:15px;width:18px;text-align:center;flex-shrink:0}
.sidebar .nav-link:hover{color:#1c2534;background:var(--sidebar-hover)}
.sidebar .nav-link.active{color:var(--blue);background:var(--sidebar-active);font-weight:600}
.sidebar .nav-link.active i{color:var(--blue)}
.sidebar .nav-link .cnt{margin-left:auto;font-size:10.5px;font-weight:800;background:#e0e7ff;color:#4338ca;border-radius:10px;padding:1px 8px}
.sidebar-footer{margin-top:auto;padding:10px 8px 12px;border-top:1px solid var(--hair)}
#site-switch{position:relative;margin:0 4px 8px}
#site-switch-btn{width:100%;background:#fff;border:1px solid #dbe3ec;border-radius:8px;padding:7px 10px;color:#475569;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:7px;text-align:left}
#site-switch-btn:hover{background:#eff4fb;border-color:#a9c4e8;color:var(--blue)}
#site-dropdown{display:none;position:absolute;bottom:110%;left:0;right:0;background:#fff;border:1px solid #dbe3ec;border-radius:10px;overflow:hidden;box-shadow:0 -8px 24px rgba(15,23,42,.14);z-index:300;padding:5px}
#site-dropdown .si{border-radius:6px;padding:8px 10px;display:flex;align-items:center;gap:8px;color:#475569;font-size:12px;cursor:pointer}
#site-dropdown .si:hover{background:#eff4fb;color:var(--blue)}
#site-dropdown .si .bd{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:18px;color:#fff;border-radius:4px;font-size:9.5px;font-weight:700;padding:0 5px;flex-shrink:0}
.sb-user{display:flex;align-items:center;gap:9px;padding:8px 10px}
.sb-user .av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#0891b2,#2563eb);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;flex-shrink:0}
.sb-user .nm{font-size:12.5px;font-weight:700;color:#1c2534;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-user .em{font-size:10px;color:#94a3b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-user .out{margin-left:auto;color:#94a3b8;font-size:14px;cursor:pointer;flex-shrink:0}
.sb-user .out:hover{color:var(--rd)}
/* ── 본문 ── */
.main-content{flex:1;margin-left:220px;padding:12px 18px 40px;min-width:0}
.page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;border-bottom:1px solid var(--hair);padding-bottom:7px;flex-wrap:wrap;gap:8px}
.page-header h5{margin:0;font-weight:800;font-size:19px;color:#182230;letter-spacing:-.01em}
.page-header h5 i{color:var(--blue);margin-right:7px}
.page-header .sub{font-size:12.5px;color:var(--text-2);margin-top:3px}
.card{border:1px solid var(--border);border-radius:11px;box-shadow:0 1px 3px rgba(0,0,0,.04);background:#fff;margin-bottom:10px}
.card .cb{padding:10px 12px}
.card .ct{font-size:13px;font-weight:800;color:#182230;margin-bottom:9px;display:flex;align-items:center;gap:6px}
.card .ct i{color:var(--blue)}
.card .ct small{font-weight:500;color:#94a3b8;font-size:11px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* 문서형 스탯보드 (한국영업 CDU) */
.cdud{--ink:#182230;--mut:#64748b;--line:#e4e8ef;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 18px;letter-spacing:-.01em;margin-bottom:10px}
.cdud .cdud-kpis{display:flex;align-items:stretch;padding:0}
.cdud .cdud-hero{flex:1.35;min-width:0;padding-right:22px;display:flex;flex-direction:column;justify-content:center;cursor:pointer}
.cdud .cdud-hero .l{display:block;font-size:12.5px;font-weight:700;color:var(--mut)}
.cdud .cdud-hero b{display:block;font-size:26px;font-weight:800;color:var(--ink);line-height:1.1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.cdud .cdud-hero .s{display:block;font-size:12.5px;color:var(--mut);margin-top:3px}
.cdud .cdud-hero .s em{font-style:normal;font-weight:800;color:var(--rd)}
.cdud .cdud-fact{flex:1;min-width:0;padding:2px 18px;border-left:1px solid var(--line);display:flex;flex-direction:column;justify-content:center}
.cdud .cdud-fact.clk{cursor:pointer}
.cdud .cdud-fact span{display:block;font-size:12.5px;font-weight:700;color:var(--mut);white-space:nowrap}
.cdud .cdud-fact b{display:block;font-size:18px;font-weight:800;color:var(--ink);line-height:1.3;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.cdud .cdud-fact b.rd{color:var(--rd)}.cdud .cdud-fact b.gr{color:#15803d}
.cdud .cdud-fact i{display:block;font-style:normal;font-size:11.5px;color:#94a3b8;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 표 */
.table{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums;margin:0}
.table thead th{background:#fafbfc;color:#475569;font-size:11px;font-weight:700;border-top:2px solid var(--navy);border-bottom:1px solid var(--hair);padding:5px 8px;white-space:nowrap;text-align:left;line-height:1.35}
.table th.num,.table td.num{text-align:right}
.table tbody td{font-size:12px;vertical-align:middle;padding:4px 8px;border-bottom:1px solid #f0f2f6;color:var(--text);line-height:1.45}
.table tbody tr:hover td{background:#f9fafb}
.table tbody tr.clk{cursor:pointer}
/* 탭/버튼 (wt-tab) */
.wt-tab{display:inline-flex;align-items:center;gap:6px;font-family:inherit;font-size:12.5px;font-weight:600;color:#475569;background:#fff;border:1px solid #dbe3ec;border-radius:9px;padding:7px 15px;cursor:pointer;transition:all .15s;line-height:1;white-space:nowrap}
.wt-tab:hover{background:#eff4fb;border-color:#a9c4e8;color:var(--blue)}
.wt-tab i{font-size:13px;color:var(--blue)}
.wt-tab.on{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 2px 6px rgba(37,99,235,.22)}
.wt-tab.on i{color:#fff}
.btn-main{border:none;background:var(--blue);color:#fff;border-radius:9px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 2px 6px rgba(37,99,235,.25)}
.btn-main:hover{filter:brightness(1.07)}
.flt{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.flt select,.flt input{border:1px solid #dbe3ec;border-radius:8px;padding:7px 10px;font-size:12.5px;background:#fff;color:var(--text)}
.muted{color:#94a3b8;font-size:12px}
canvas{max-height:185px}
/* 상태 칩 */
.chip{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap}
.chip.paid{background:#dbeafe;color:#1d4ed8}.chip.free{background:#fef3c7;color:#b45309}
.st-req{background:#e0e7ff;color:#4338ca}.st-prep{background:#fef3c7;color:#b45309}.st-ready{background:#dbeafe;color:#1d4ed8}.st-shipped{background:#dcfce7;color:#15803d}.st-hold{background:#f1f5f9;color:#64748b}.st-cancel{background:#fee2e2;color:#b91c1c}
/* 칸반 */
.kb{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:start}
.kb-col{background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.kb-h{padding:12px 15px;border-bottom:1px solid var(--hair)}
.kb-h b{font-size:13.5px;color:#182230}
.kb-h .who{font-size:11px;color:#94a3b8;font-weight:600;margin-top:2px}
.kb-h .n{float:right;font-size:12px;font-weight:800;background:#f1f5f9;color:#475569;border-radius:10px;padding:2px 9px}
.kb-list{padding:10px;max-height:62vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px;background:#fafbfd;min-height:90px}
.kb-card{background:#fff;border:1px solid var(--hair);border-radius:10px;padding:9px 11px;cursor:pointer;transition:.13s}
.kb-card:hover{border-color:#a9c4e8;box-shadow:0 4px 12px rgba(37,99,235,.10);transform:translateY(-1px)}
.kb-card .t1{font-size:13px;font-weight:700;color:#182230;display:flex;justify-content:space-between;gap:6px;align-items:center}
.kb-card .t2{font-size:12px;color:#475569;margin-top:3px}
.kb-card .t3{font-size:11px;color:#94a3b8;margin-top:5px;display:flex;justify-content:space-between;gap:6px}
/* 주간 달력 */
.wkgrid{display:grid;grid-template-columns:repeat(7,minmax(104px,1fr));gap:7px;min-width:760px}
.wkcell{border:1px solid var(--hair);border-radius:10px;min-height:46vh;background:#fff;overflow-y:auto}
.wkcell.today{border-color:#93c5fd;background:var(--blue-light);box-shadow:0 0 0 1px #93c5fd}
.wkhead{padding:6px 9px;font-size:11px;font-weight:800;border-bottom:1px solid #f1f3f7;color:#475569}
.wkitem{border-left:3px solid var(--blue);background:#eff6ff;border-radius:5px;padding:3px 7px;margin:3px 5px;font-size:10.5px;line-height:1.45;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 모달 폼 */
.sect-h{font-size:12.5px;font-weight:800;color:#16324f;background:#f2f6fb;border:1px solid #e2eaf4;border-radius:8px;padding:7px 12px;margin:16px 0 11px;display:flex;justify-content:space-between;align-items:center}
.sect-h:first-of-type{margin-top:0}
.sect-h .team{font-size:10.5px;color:#64748b;font-weight:600}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.mgrid{display:grid;grid-template-columns:1.05fr 1fr;gap:0 30px;align-items:start}
.mgrid>div>.sect-h:first-child{margin-top:0}
@media(max-width:980px){.mgrid{grid-template-columns:1fr}}
/* 토스트 */
#wtToast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:#16324f;color:#fff;font-size:13px;font-weight:600;border-radius:10px;padding:10px 20px;box-shadow:0 8px 24px rgba(15,23,42,.3);opacity:0;transition:all .25s;z-index:3000;pointer-events:none}
#wtToast.on{opacity:1;transform:translateX(-50%) translateY(0)}
/* 단계 스테퍼 */
.stepper{display:flex;align-items:center;gap:0;margin-bottom:14px;flex-wrap:wrap}
.stepper .stp{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#94a3b8}
.stepper .stp .dot{width:22px;height:22px;border-radius:50%;background:#f1f5f9;border:1.5px solid #dbe3ec;color:#94a3b8;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800}
.stepper .stp.done .dot{background:#dcfce7;border-color:#86efac;color:#15803d}
.stepper .stp.cur .dot{background:var(--blue);border-color:var(--blue);color:#fff}
.stepper .stp.cur{color:var(--blue)}
.stepper .stp.done{color:#15803d}
.stepper .bar{width:26px;height:1.5px;background:#dbe3ec;margin:0 7px}
/* 이력 동기화 칩 */
#histSync{font-size:10.5px;color:#94a3b8;padding:4px 10px 8px;display:flex;align-items:center;gap:5px}
.sb-tool{display:flex;align-items:center;gap:9px;padding:7px 12px;margin:1px 8px;border-radius:6px;font-size:12.5px;font-weight:500;color:#475569;cursor:pointer;transition:.13s}
.sb-tool:hover{background:var(--sidebar-hover);color:#1c2534}
.sb-tool i{font-size:14px;width:18px;text-align:center}
.sbtn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:5px;border:1px solid #dbe3ec;background:#fff;border-radius:8px;padding:6px 0;font-size:11.5px;font-weight:600;color:#475569;cursor:pointer;transition:.13s}
.sbtn:hover{background:#eff4fb;border-color:#a9c4e8;color:var(--blue)}
.scrolly{max-height:60vh;overflow-y:auto}
.scrolly thead th{position:sticky;top:0;z-index:2}
.fg{margin-bottom:10px}
.fg label{display:block;font-size:11.5px;color:#64748b;font-weight:700;margin-bottom:4px}
.fg input,.fg select,.fg textarea{width:100%;border:1px solid #dbe3ec;border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit}
.fg input:focus,.fg select:focus{outline:none;border-color:#93c5fd;box-shadow:0 0 0 3px rgba(37,99,235,.08)}
.fg input:disabled,.fg select:disabled{background:#f8fafc;color:#94a3b8}
.view{display:none}.view.on{display:block}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
/* 오늘 할 일 리스트 */
.todo-row{display:flex;gap:8px;padding:4px 4px;border-bottom:1px solid #f1f5f9;font-size:12.5px;align-items:center;cursor:pointer;border-radius:6px}
.todo-row:hover{background:#f8fafc}
/* 원터치 칩 (한국영업 CDU) */
.cdu-chip{display:inline-block;padding:4px 11px;border-radius:15px;font-size:11.5px;font-weight:600;border:1px solid #e5e7eb;background:#fff;color:#6b7280;cursor:pointer;margin:3px 4px 0 0;user-select:none;transition:all .12s}
.cdu-chip:hover{border-color:#a9c4e8;color:var(--blue)}
/* 칸반 원클릭 진행 버튼 */
.kb-adv{width:100%;margin-top:8px;border:1px solid #dbe3ec;background:#f8fafc;color:#475569;border-radius:7px;padding:5px 0;font-size:11.5px;font-weight:700;cursor:pointer;transition:all .13s}
.kb-adv:hover{background:var(--blue);border-color:var(--blue);color:#fff}
.kb-adv.done:hover{background:#15803d;border-color:#15803d}
/* 업무보고 문서 */
.rpt{background:#fff;border:1px solid var(--hair);border-radius:14px;padding:20px 26px;max-width:900px;letter-spacing:-.01em}
.rpt h3{font-size:17px;font-weight:800;color:#182230;margin:0 0 4px;border-bottom:2px solid var(--navy);padding-bottom:10px}
.rpt .rpt-meta{font-size:12px;color:#94a3b8;margin:8px 0 18px}
.rpt h4{font-size:13.5px;font-weight:800;color:#16324f;margin:20px 0 8px}
.rpt table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.rpt th{background:#fafbfc;border-top:1.5px solid var(--navy);border-bottom:1px solid var(--hair);padding:7px 9px;text-align:left;font-size:11.5px;color:#475569;white-space:nowrap}
.rpt td{padding:7px 9px;border-bottom:1px solid #eef1f5}
.rpt .num{text-align:right}
@media print{body>*{display:none!important}body{display:block!important;background:#fff!important}#printHost{display:block!important;margin:0}}
@media(max-width:1150px){.grid2{grid-template-columns:1fr}.kb{grid-template-columns:repeat(2,1fr)}.cdud .cdud-kpis{flex-wrap:wrap}.cdud .cdud-fact{min-width:44%;padding:8px 14px}}
@media(max-width:760px){.sidebar{width:62px}.sidebar-brand b,.sidebar-brand small,.sidebar .nav-link span,.nav-label,.sidebar-footer{display:none}.sidebar .nav-link{justify-content:center}.sidebar .nav-link .cnt{display:none}.main-content{margin-left:62px;padding:16px}.kb{grid-template-columns:1fr}.cdud{padding:16px 15px}}
</style>
</head>
<body>
<div id="login-screen" style="position:fixed;inset:0;background:linear-gradient(135deg,#0f172a,#0e2a3a);z-index:9999;display:none;align-items:center;justify-content:center;padding:20px">
  <div style="background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:34px 32px;width:340px;backdrop-filter:blur(12px)">
    <div style="text-align:center;margin-bottom:22px">
      <div style="font-size:26px">🌐</div>
      <div style="font-size:17px;font-weight:800;color:#f1f5f9;margin-top:6px">원텍 해외수출 관리</div>
      <div style="font-size:11.5px;color:#64748b;margin-top:3px">해외영업 · 영업전략파트 · 글로벌물류관리팀</div>
    </div>
    <input id="login-email" type="email" placeholder="이메일" autocomplete="username" style="width:100%;padding:11px 13px;margin-bottom:10px;border:1px solid #334155;background:rgba(0,0,0,.2);color:#e2e8f0;border-radius:10px;font-size:14px">
    <input id="login-pw" type="password" placeholder="비밀번호" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()" style="width:100%;padding:11px 13px;margin-bottom:14px;border:1px solid #334155;background:rgba(0,0,0,.2);color:#e2e8f0;border-radius:10px;font-size:14px">
    <div id="login-error" style="display:none;color:#f87171;font-size:12.5px;margin-bottom:12px;text-align:center"></div>
    <button id="login-btn" onclick="doLogin()" style="width:100%;padding:12px;background:linear-gradient(135deg,#0891b2,#2563eb);border:none;border-radius:10px;color:#fff;font-size:14px;font-weight:700;cursor:pointer">로그인</button>
    <div style="text-align:center;margin-top:16px;font-size:11px;color:#475569">원텍 계정으로 로그인</div>
  </div>
</div>

<nav class="sidebar">
  <div class="sidebar-brand">
    <div class="lg"><i class="bi bi-globe-americas"></i></div>
    <div><b>해외수출 관리</b><small>수출입 · 선적 · 물류</small></div>
  </div>
  <div class="nav-section">
    <div class="nav-link active" data-v="dash"><i class="bi bi-house-door-fill"></i><span>대시보드</span></div>
    <div class="nav-label">업무</div>
    <div class="nav-link" data-v="flow"><i class="bi bi-kanban"></i><span>선적 진행</span><span class="cnt" id="cntFlow">0</span></div>
    <div class="nav-link" data-v="sched"><i class="bi bi-calendar-week"></i><span>일일 현황 · 일정</span></div>
    <div class="nav-link" data-v="ledger"><i class="bi bi-journal-text"></i><span>선적 대장</span></div>
    <div class="nav-label">분석</div>
    <div class="nav-link" data-v="anal"><i class="bi bi-bar-chart-line"></i><span>수출 분석</span></div>
  </div>

    '<div id="m-freewrap">'+fld('m-reason','무상 사유',inp('m-reason',r.reason,'text','데모 / 전시회 / CS / FOC 등',!editable))+(editable?'<div style="margin-top:-4px">'+['데모','전시회','CS','FOC','프로모션','반품','교체','테스트'].map(function(c){return '<span class="cdu-chip" onclick="document.getElementById(\'m-reason\').value=\''+c+'\'">'+c+'</span>';}).join('')+'</div>':'')+'</div></div>';
  b+='<div class="frow">'+
    fld('m-reqOwner','요청 담당 <span style="color:#94a3b8;font-weight:500">(자동: 로그인 사용자 · 수정 가능)</span>',inp('m-reqOwner',r.reqOwner||(isNew?ME.name:''),'text','',!editable))+
    '<div></div></div>';
  b+='</div><div><div class="sect-h">② 수출 준비 <span class="team">영업전략파트</span></div>';
  b+='<div class="frow">'+
    fld('m-serial','Serial No.',inp('m-serial',r.serial,'text','시리얼 (범위 가능: ~)',!editable))+
    fld('m-prodDate','생산일자',inp('m-prodDate',r.prodDate,'date','',!editable))+'</div>';
  b+='<div class="frow">'+
    fld('m-prepOwner','준비 담당 <span style="color:#94a3b8;font-weight:500">(입력 시 자동 기재)</span>',inp('m-prepOwner',r.prepOwner,'text','',!editable))+
    '<div></div></div>';
  b+='<div class="sect-h">③ 출고 <span class="team">글로벌물류관리팀</span></div>';
  b+='<div class="frow">'+
    fld('m-logi','물류사·포워더',inp('m-logi',r.logi,'text','예: DHL / 태화 / 에어로',!editable)+(editable?'<div style="margin-top:2px">'+topLogi().map(function(c){return '<span class="cdu-chip" onclick="document.getElementById(\'m-logi\').value=\''+esc(c)+'\'">'+esc(c)+'</span>';}).join('')+'</div>':''))+
    fld('m-date','출고일 (예정/확정)',inp('m-date',r.date,'date','',!editable))+'</div>';
  b+='<div class="frow">'+
    fld('m-logiOwner','출고 담당 <span style="color:#94a3b8;font-weight:500">(입력 시 자동 기재)</span>',inp('m-logiOwner',r.logiOwner,'text','',!editable))+
    fld('m-shipNote','출고 비고',inp('m-shipNote',r.shipNote,'text','당착 / 분할 등',!editable))+'</div>';
  b+='<div class="fg">'+'<label>메모</label>'+inp('m-memo',r.memo,'text','',!editable)+'</div></div></div>';
  if(!isNew&&r.hist&&r.hist.length){
    b+='<div class="sect-h">🕑 이력</div><div style="font-size:11.5px;color:#64748b;max-height:110px;overflow-y:auto">'+r.hist.slice().reverse().map(function(h){return '<div style="padding:2px 0">'+esc(h.at||'')+' · '+esc(h.by||'')+' — '+esc(h.a||'')+'</div>';}).join('')+'</div>';
  }
  if(!editable)b+='<div style="margin-top:10px;font-size:12px;color:#b45309;background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:8px 12px">출고완료된 이력은 관리자·김한결 과장만 수정할 수 있습니다.</div>';
  b+=dls('m-country',dlist('country'))+dls('m-company',dlist('company'))+dls('m-product',dlist('product'))+dls('m-logi',dlist('logi'));
  document.getElementById('recBody').innerHTML=b;
  document.getElementById('recDelBtn').style.display=(!isNew&&canDel())?'':'none';
  document.getElementById('recSaveBtn').style.display=editable?'':'none';
  function syncType(){var t=document.getElementById('m-type').value;document.getElementById('m-paidwrap').style.display=t==='paid'?'':'none';document.getElementById('m-freewrap').style.display=t==='free'?'':'none';}
  document.getElementById('m-type').addEventListener('change',syncType);syncType();
  _modal=new bootstrap.Modal(document.getElementById('recModal'));_modal.show();
}
function gv(id){var e=document.getElementById(id);return e?e.value:'';}
async function saveRec(){
  var isNew=!_cur;
  var r=_cur?JSON.parse(JSON.stringify(_cur)):{id:'S'+APP.seq,st:'req',hist:[]};
  var prevSt=r.st;
  if(!isNew&&document.getElementById('m-st'))r.st=gv('m-st');
  r.type=gv('m-type');r.country=gv('m-country').trim();r.company=gv('m-company').trim();
  r.product=gv('m-product').trim();if(!r.productRaw)r.productRaw=r.product;
  r.cat=gv('m-cat');r.qty=Number(gv('m-qty'))||0;
  r.amount=Number(gv('m-amount'))||0;r.cur=(r.type==='paid')?gv('m-cur'):'';
  r.reason=(r.type==='free')?gv('m-reason').trim():'';
  r.serial=gv('m-serial').trim();r.prodDate=gv('m-prodDate');r.logi=gv('m-logi').trim();
  r.date=gv('m-date');r.shipNote=gv('m-shipNote').trim();r.memo=gv('m-memo').trim();
  r.reqOwner=gv('m-reqOwner').trim()||ME.name;
  r.prepOwner=gv('m-prepOwner').trim();
  r.logiOwner=gv('m-logiOwner').trim();
  // 담당 자동 기재: 해당 단계 필드를 채웠는데 담당이 비어있으면 로그인 사용자
  if((r.serial||r.prodDate)&&!r.prepOwner)r.prepOwner=ME.name;
  if((r.logi||r.date)&&!r.logiOwner)r.logiOwner=ME.name;
  if(!r.country||!r.company||!r.product){alert('국가·업체명·품목은 필수입니다');return;}
  if(!r.qty){alert('수량을 입력하세요');return;}
  // 시리얼 중복 경고
  if(r.serial){
    var dup=APP.recs.filter(function(x){return x.id!==r.id&&x.serial&&x.serial===r.serial;})[0];
    if(dup&&!confirm('⚠ 동일한 시리얼이 이미 등록되어 있습니다:\n'+recLabel(dup)+' ('+(dup.date||ST[dup.st].ko)+')\n\n그래도 저장할까요?'))return;
  }
  if(isNew)r.st='req';
  var act=isNew?'등록':(prevSt!==r.st?('상태 '+ST[prevSt].ko+'→'+ST[r.st].ko):'수정');
  r.hist=(r.hist||[]).concat([{at:nowIso(),by:ME.name||ME.email,a:act}]).slice(-30);
  r.updAt=nowIso();r.updBy=ME.email;
  if(isNew)APP.seq++;
  var btn=document.getElementById('recSaveBtn');btn.disabled=true;btn.textContent='저장 중...';
  var ok=await saveData([r]);
  btn.disabled=false;btn.textContent='저장';
  if(!ok)return;
  _modal.hide();toast(isNew?'📝 선적 요청이 등록되었습니다':'저장되었습니다');renderCur();renderFlowCnt();
}
async function delRec(){
  if(!_cur)return;
  if(!confirm('이 선적 건을 삭제할까요? (되돌릴 수 없음)'))return;
  var ok=await saveData([{id:_cur.id,_del:true,_h:!!_cur._h}]);
  if(!ok)return;
  _modal.hide();toast('🗑 삭제되었습니다');renderCur();renderFlowCnt();
}
function renderFlowCnt(){var el=document.getElementById('cntFlow');if(el)el.textContent=pendings().length;}

/* ═══════════ 원클릭 단계 진행 ═══════════ */
async function quickAdvance(id){
  var r=APP.recs.filter(function(x){return x.id===id;})[0];if(!r)return;
  var next={req:'prep',prep:'ready',ready:'shipped',hold:'req'}[r.st];if(!next)return;
  var c=JSON.parse(JSON.stringify(r));
  var prevSt=c.st;c.st=next;
  if(next==='prep'&&!c.prepOwner)c.prepOwner=ME.name;
  if(next==='ready'&&!c.logiOwner)c.logiOwner=ME.name;
  if(next==='shipped'){if(!c.date)c.date=today();if(!c.logiOwner)c.logiOwner=ME.name;}
  c.hist=(c.hist||[]).concat([{at:nowIso(),by:ME.name||ME.email,a:'상태 '+ST[prevSt].ko+'→'+ST[next].ko+' (원클릭)'}]).slice(-30);
  c.updAt=nowIso();c.updBy=ME.email;
  var ok=await saveData([c]);if(!ok)return;
  toast(next==='shipped'?'✅ 출고완료 처리 — 선적 대장에서 확인하세요':(ST[prevSt].ko+' → '+ST[next].ko+' 이동 · 담당: '+(next==='prep'?c.prepOwner:c.logiOwner||c.prepOwner||c.reqOwner)));
  renderCur();renderFlowCnt();
}

/* ═══════════ 일일 업무보고 ═══════════ */
function _rptData(d){
  var shipToday=APP.recs.filter(function(r){return r.st==='shipped'&&r.date===d;});
  var d7=new Date(d+'T00:00');d7.setDate(d7.getDate()+7);
  var f=function(x){return x.toISOString().slice(0,10);};
  var upcoming=APP.recs.filter(function(r){return (r.st==='ready'||r.st==='prep')&&r.date&&r.date>d&&r.date<=f(d7);}).sort(function(a,b){return a.date<b.date?-1:1;});
  var pend=pendings();var byS={req:0,prep:0,ready:0,hold:0};pend.forEach(function(r){if(byS[r.st]!=null)byS[r.st]++;});
  var late=pend.filter(function(r){return r.date&&r.date<d&&r.st!=='hold';});
  return {shipToday:shipToday,upcoming:upcoming,byS:byS,late:late};
}
function _rptDocHtml(d){
  var x=_rptData(d);
  var amt=x.shipToday.reduce(function(s,r){return s+(r.type==='paid'&&r.cur==='USD'?(r.amount||0):0);},0);
  var qty=x.shipToday.reduce(function(s,r){return s+(r.qty||0);},0);
  function tbl(rows,withLogi){
    if(!rows.length)return '<div class="muted" style="padding:8px 2px">해당 없음</div>';
    return '<table><thead><tr>'+(withLogi?'<th>출고일</th>':'')+'<th>구분</th><th>국가</th><th>업체</th><th>품목</th><th class="num">수량</th><th class="num">금액</th><th>물류사</th><th>담당</th></tr></thead><tbody>'+
      rows.map(function(r){return '<tr class="clk" style="cursor:pointer" onclick="openRec(\''+r.id+'\')">'+(withLogi?'<td>'+esc(r.date)+'</td>':'')+'<td>'+(r.type==='paid'?'유상':'무상')+'</td><td>'+esc(r.country||'')+'</td><td>'+esc(r.company||'')+'</td><td>'+esc(r.product||r.productRaw||'')+'</td><td class="num">'+Math.round(r.qty||0)+'</td><td class="num">'+(r.type==='paid'?(r.cur==='USD'?usd(r.amount):esc(r.cur||'')):esc(r.reason||'무상'))+'</td><td>'+esc(r.logi||'')+'</td><td>'+esc(r.logiOwner||r.prepOwner||r.reqOwner||'')+'</td></tr>';}).join('')+'</tbody></table>';
  }
  return '<div class="rpt">'+
    '<h3>▣ 해외수출 일일 업무보고</h3>'+
    '<div class="rpt-meta">'+d+' · 작성: '+esc(ME.name)+' · 해외영업 / 영업전략파트 / 글로벌물류관리팀</div>'+
    '<h4>1. 금일 출고 — '+x.shipToday.length+'건 · '+Math.round(qty).toLocaleString()+'대 · '+usd(amt)+' <span style="font-weight:500;color:#94a3b8;font-size:11px">(유상 USD 기준)</span></h4>'+tbl(x.shipToday,false)+
    '<h4>2. 출고 예정 (7일 이내) — '+x.upcoming.length+'건</h4>'+tbl(x.upcoming,true)+
    '<h4>3. 진행 현황</h4><div style="font-size:13px;padding:2px 2px 4px">요청 <b>'+x.byS.req+'</b>건 · 준비중 <b>'+x.byS.prep+'</b>건 · 출고대기 <b>'+x.byS.ready+'</b>건 · 보류 <b>'+x.byS.hold+'</b>건</div>'+
    '<h4 style="color:#b91c1c">4. 지연 (예정일 경과 · 미출고) — '+x.late.length+'건</h4>'+tbl(x.late,true)+
  '</div>';
}
function _rptText(d){
  d=d||today();
  var x=_rptData(d);
  var amt=x.shipToday.reduce(function(s,r){return s+(r.type==='paid'&&r.cur==='USD'?(r.amount||0):0);},0);
  function line(r,withD){return ' - '+(withD?r.date+' ':'')+(r.country||'')+' / '+(r.company||'')+' / '+(r.product||r.productRaw||'')+' ×'+Math.round(r.qty||0)+(r.type==='paid'?(r.cur==='USD'?' / '+usd(r.amount):' / '+(r.cur||'')):' / 무상('+(r.reason||'')+')')+(r.logi?' / '+r.logi:'');}
  var t='▣ 해외수출 일일 업무보고 ('+d+')\n\n';
  t+='1. 금일 출고: '+x.shipToday.length+'건 / '+usd(amt)+'\n'+(x.shipToday.map(function(r){return line(r,false);}).join('\n')||' - 해당 없음')+'\n\n';
  t+='2. 출고 예정(7일): '+x.upcoming.length+'건\n'+(x.upcoming.map(function(r){return line(r,true);}).join('\n')||' - 해당 없음')+'\n\n';
  t+='3. 진행: 요청 '+x.byS.req+' / 준비중 '+x.byS.prep+' / 출고대기 '+x.byS.ready+' / 보류 '+x.byS.hold+'\n\n';
  t+='4. 지연: '+x.late.length+'건\n'+(x.late.map(function(r){return line(r,true);}).join('\n')||' - 없음');
  return t;
}
function copyReport(){
  var t=_rptText();
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){alert('보고서 텍스트가 복사되었습니다. 그룹웨어에 붙여넣으세요.');});}
  else{var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();alert('복사되었습니다.');}
}
function printReport(){
  var host=document.getElementById('printHost');
  if(!host){host=document.createElement('div');host.id='printHost';host.style.display='none';document.body.appendChild(host);}
  host.innerHTML=_rptDocHtml(today());
  window.print();
}

var TITLES={dash:['대시보드','수출 업무 · 실적 종합 현황','bi-house-door-fill'],flow:['선적 진행','요청 → 준비 → 출고 · 해외영업×영업전략파트×글로벌물류관리팀','bi-kanban'],sched:['일일 현황 · 출고 일정','오늘 현황 · 내일 예정 · 주간 캘린더 · 일일보고 복사','bi-calendar-week'],ledger:['선적 대장','전체 선적 기록 · 검색/필터/CSV','bi-journal-text'],anal:['수출 분석','국가·품목·업체·월별·무상 분석 (출고완료 기준)','bi-bar-chart-line']};
function show(v,fromPop){
  if(!TITLES[v])v='dash';
  if(!fromPop){try{history.pushState({v:v},'','#v='+v);}catch(e){}}
  try{sessionStorage.setItem('wtx_page',v);}catch(e){}
  document.querySelectorAll('.sidebar .nav-link').forEach(function(n){n.classList.toggle('active',n.dataset.v===v);});
  document.querySelectorAll('.view').forEach(function(el){el.classList.toggle('on',el.id==='view-'+v);});
  document.getElementById('vTitle').textContent=TITLES[v][0];
  document.getElementById('vSub').textContent=TITLES[v][1];
  document.getElementById('vIcon').className='bi '+TITLES[v][2];
  CUR=v;
  renderCur();renderFlowCnt();
  document.getElementById('site-dropdown').style.display='none';
}
function ledGo(p){window._ledPre=p||null;show('ledger');}
function renderCur(){({dash:renderDash,flow:renderFlow,sched:renderSched,ledger:function(){
  if(!document.getElementById('fCountry').options.length)fillLedgerFilters();
  var p=window._ledPre;
  if(p){window._ledPre=null;
    if(p.st!=null)document.getElementById('fSt').value=p.st;
    if(p.ym){document.getElementById('fYear').value=p.ym.slice(0,4);document.getElementById('fMonth').value=p.ym.slice(5,7);}
    ledShow=200;}
  renderLedger();
},anal:renderAnal}[CUR])();}
document.querySelectorAll('.sidebar .nav-link').forEach(function(n){n.onclick=function(){show(n.dataset.v);};});
window.addEventListener('popstate',function(e){
  var v=(e.state&&e.state.v)||((location.hash.match(/v=([a-z]+)/)||[])[1])||'dash';
  if(window.APP&&document.getElementById('view-'+v))show(v,true);
});
document.querySelectorAll('#yrseg .wt-tab').forEach(function(b){b.onclick=function(){YEAR=b.dataset.y;b.parentElement.querySelectorAll('.wt-tab').forEach(function(x){x.classList.toggle('on',x===b);});renderAnal();};});
document.querySelectorAll('#analTabs .wt-tab').forEach(function(b){b.onclick=function(){ANALT=b.dataset.t;b.parentElement.querySelectorAll('.wt-tab').forEach(function(x){x.classList.toggle('on',x===b);});renderAnal();};});
</script>
